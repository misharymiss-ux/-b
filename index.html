<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مدرسة ثنايا المعرفة الأهلية</title>
<meta name="theme-color" content="#2563eb">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#0f1a2e;--mut:#5b6b82;--pri:#2563eb;--in:#2563eb;--out:#dc2626;--bd:#dbe3ef;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--card:#111c33;--tx:#e6edf7;--mut:#93a3b8;--pri:#60a5fa;--bd:#233556}}
:root[data-theme="dark"]{--bg:#0b1220;--card:#111c33;--tx:#e6edf7;--mut:#93a3b8;--pri:#60a5fa;--bd:#233556}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:Tajawal,Tahoma,Arial,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--bd);flex-wrap:wrap;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;flex:1;min-width:150px;font-size:15px}
.brand img{width:40px;height:40px;border-radius:50%}
.hb{border:1px solid var(--bd);background:var(--bg);color:var(--tx);border-radius:10px;padding:7px 10px;font:inherit;font-size:13px;cursor:pointer}
.hb.p{background:var(--pri);color:#fff;border-color:var(--pri)}
.stf{display:none}body.st .stf{display:inline-block}
main{flex:1;padding:14px;max-width:640px;width:100%;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:12px}
h2{margin:0 0 10px;font-size:18px}h3{margin:0 0 6px;font-size:15px}
.mut{color:var(--mut);font-size:13px}
.clock{font-size:42px;font-weight:700;text-align:center;direction:ltr;font-variant-numeric:tabular-nums}
.fp{display:block;margin:14px auto;width:170px;height:170px;border-radius:50%;border:0;color:#fff;font:inherit;font-weight:700;font-size:17px;cursor:pointer;box-shadow:0 8px 24px #0003}
.fp svg{width:64px;height:64px;display:block;margin:0 auto 6px}
.fp.in,.fp.out{background:#2563eb}.fp:disabled{opacity:.6}
.row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--bd);font-size:14px}.row:last-child{border:0}
.tag{padding:2px 8px;border-radius:99px;font-size:12px;color:#fff}.tag.in{background:var(--in)}.tag.out{background:var(--out)}
input,select{width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);font:inherit}
.btn{width:100%;padding:11px;border-radius:12px;border:0;background:var(--pri);color:#fff;font:inherit;font-weight:700;cursor:pointer;margin-top:8px;display:block;text-align:center;text-decoration:none}
.btn.s{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}
.al{background:#fee2e2;color:#7f1d1d;border-radius:12px;padding:10px;margin-bottom:8px;font-size:14px}
.wn{background:#fef3c7;color:#78350f}
footer{display:none;position:sticky;bottom:0;background:var(--card);border-top:1px solid var(--bd);grid-template-columns:repeat(4,1fr)}
body.st footer{display:grid}
footer a{padding:10px 4px;text-align:center;color:var(--mut);text-decoration:none;font-size:12px}
footer a.on{color:var(--pri);font-weight:700}footer a span{display:block;font-size:20px}
.ban{background:#f59e0b;color:#1c1300;padding:10px 14px;display:none;align-items:center;gap:10px;justify-content:space-between;font-size:14px}
.ban button{border:0;border-radius:8px;padding:6px 10px;font:inherit;cursor:pointer}
.links a{display:block;padding:10px 0;color:var(--pri);border-bottom:1px solid var(--bd);text-decoration:none}
.lk{text-align:center;margin-top:10px;font-size:13px}.lk a{color:var(--pri);margin:0 6px}
#toast{position:fixed;bottom:84px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:9;max-width:90%}
</style>
</head>
<body>
<div class="ban" id="ban"><span>يتوفر إصدار جديد من التطبيق.</span><button onclick="location.reload()">تحديث الآن</button></div>
<header>
  <div class="brand"><img id="logo" alt=""><span>مدرسة ثنايا المعرفة الأهلية</span></div>
  <button class="hb p" id="inst" onclick="install()">تثبيت التطبيق</button>
  <button class="hb stf" onclick="exportCSV()">⬇ تصدير CSV</button>
  <button class="hb stf" onclick="location.hash='#emps'">👥 الموظفون</button>
  <button class="hb" onclick="shareApp()">↗ مشاركة التطبيق</button>
</header>
<main id="app"></main>
<footer id="nav">
  <a href="#home"><span>🏠</span>اللوحة</a>
  <a href="#log"><span>📋</span>السجل</a>
  <a href="#report"><span>📊</span>التقارير</a>
  <a href="#settings"><span>⚙️</span>الإعدادات</a>
</footer>
<div id="toast"></div>

  const code=`const C="att-${VERSION}";self.addEventListener("install",e=>self.skipWaiting());self.addEventListener("activate",e=>e.waitUntil(clients.claim()));self.addEventListener("fetch",e=>{if(e.request.method!=="GET"||e.request.url.includes("firebaseio"))return;e.respondWith(fetch(e.request).then(r=>{const c=r.clone();caches.open(C).then(k=>k.put(e.request,c));return r}).catch(()=>caches.match(e.request)))});`;
  try{const u=URL.createObjectURL(new Blob([code],{type:"text/javascript"}));
    navigator.serviceWorker.register(u).then(()=>swStatus="مُسجَّل").catch(e=>swStatus="رفض المتصفح تسجيل الـ SW من ملف مدمج ("+e.name+")");
  }catch(e){swStatus="تعذّر التسجيل: "+e.name}

async function api(p,m,b){ // يعيد null عند الفشل أو عدم التفعيل
  if(!CFG.DB_URL)return null;
  let q="";
  if(CFG.API_KEY){const t=await idt();if(!t)return null;q="?auth="+t}
  try{const r=await fetch(CFG.DB_URL.replace(/\/$/,"")+"/"+p+".json"+q,{method:m||"GET",headers:{"Content-Type":"application/json"},body:b?JSON.stringify(b):undefined});return r.ok?await r.json():null}catch(e){return null}}
/* توكن Firebase Auth: الموظف يدخل كمجهول، والإدارة بالبريد وكلمة المرور */
let tok=null,tokExp=0;
async function idt(){
  if(tok&&Date.now()<tokExp)return tok;
  const post=async(u,h,b)=>{try{return await(await fetch(u+CFG.API_KEY,{method:"POST",headers:{"Content-Type":h},body:b})).json()}catch(e){return {}}};
  const keep=(j,a,b,c)=>{tok=j[a];tokExp=Date.now()+(+j[c]-60)*1000;db.rt=j[b];save();return tok};
  if(db.rt){const j=await post("https://securetoken.googleapis.com/v1/token?key=","application/x-www-form-urlencoded","grant_type=refresh_token&refresh_token="+encodeURIComponent(db.rt));if(j.id_token)return keep(j,"id_token","refresh_token","expires_in")}
  if(!staff()){const j=await post("https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=","application/json",'{"returnSecureToken":true}');if(j.idToken)return keep(j,"idToken","refreshToken","expiresIn")}
  return null;
}

/* ================= الموقع والنطاق ================= */
let loc=null;
const getSite=()=>db.site||(CFG.SCHOOL.lat!=null?CFG.SCHOOL:null);
function getPos(){return new Promise((res,rej)=>{
  if(!navigator.geolocation)return rej(new Error("no-geo"));
  navigator.geolocation.getCurrentPosition(p=>res({lat:+p.coords.latitude.toFixed(6),lng:+p.coords.longitude.toFixed(6),acc:Math.round(p.coords.accuracy)}),rej,{enableHighAccuracy:true,timeout:15000,maximumAge:0});
})}
function dist(a,b){const R=6371000,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dg=r(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dg/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
function parseCoords(s){try{s=decodeURIComponent(s||"")}catch(e){s=s||""}
  const m=s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/)||s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/)||s.match(/[?&](?:q|ll|query)=(-?\d+\.\d+),\s*(-?\d+\.\d+)/)||s.match(/(-?\d{1,3}\.\d+)\s*[,،\s]\s*(-?\d{1,3}\.\d+)/);
  return m?{lat:+m[1],lng:+m[2]}:null}
function setSite(c){db.site=c;save();api("site","PUT",c);toast("تم حفظ موقع المدرسة"+(CFG.DB_URL?" ومزامنته":""));render()}
function saveSite(){const c=parseCoords($("#sitein").value);if(!c||Math.abs(c.lat)>90||Math.abs(c.lng)>180)return toast("لم أتعرّف على الإحداثيات: الصق رابط الخريطة الكامل أو lat,lng");setSite(c)}
async function siteHere(){try{const p=await getPos();setSite({lat:p.lat,lng:p.lng})}catch(e){toast("تعذّر تحديد الموقع")}}
function siteInfo(){const S=getSite();if(!S)return"⚠️ لم يُحدَّد موقع المدرسة بعد (يحدده المدير من الإعدادات)";if(!loc)return"📍 الموقع غير محدد بعد";
  const d=dist(loc,S);return"📍 "+(d<=CFG.RADIUS?"داخل نطاق المدرسة":"خارج نطاق المدرسة")+" • تبعد "+(d/1000).toFixed(2)+" كم • دقة ±"+loc.acc+" م"}

}

const b64=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const canBio=()=>!!(window.PublicKeyCredential&&navigator.credentials);
async function enrollBio(){
  const c=await navigator.credentials.create({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),rp:{name:"مدرسة ثنايا المعرفة الأهلية"},
    user:{id:crypto.getRandomValues(new Uint8Array(16)),name:db.me.nid,displayName:db.me.name},
    pubKeyCredParams:[{type:"public-key",alg:-7},{type:"public-key",alg:-257}],
    authenticatorSelection:{authenticatorAttachment:"platform",userVerification:"required"},timeout:60000}});
  db.cred=b64(c.rawId);save();
}
async function verifyBio(){await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)),
  allowCredentials:[{type:"public-key",id:unb64(db.cred),transports:["internal"]}],userVerification:"required",timeout:60000}})}

let busy=false;
async function punch(){
  if(busy)return;
  if(!db.me){ // الإدارة: تسجيل البيانات عند أول بصمة
    if(!staff())return;
    const n=($("#en")||{value:""}).value.trim(),i=($("#ei")||{value:""}).value.trim();
    if(n.length<3)return toast("اكتب اسمك الكامل");
    if(!/^[12]\d{9}$/.test(i))return toast("رقم الهوية 10 أرقام ويبدأ بـ 1 أو 2");
    db.me={name:n,nid:i};save();startWatch();
  }
  busy=true;render();
  const fail=m=>{busy=false;render();toast(m)};
  const type=nextType();
  let S=getSite();if(!S){await pullSite();S=getSite()}
  if(!S)return fail("لم يُحدَّد موقع المدرسة بعد، راجع المدير");
  let p;try{p=await getPos();loc=p}catch(e){return fail("يلزم تفعيل الموقع (GPS) لتسجيل البصمة")}
  const d=dist(p,S);
  if(d>CFG.RADIUS)return fail("أنت خارج نطاق المدرسة: تبعد "+(d/1000).toFixed(2)+" كم (المسموح 2 كم)");
  let v=false;
  try{if(canBio()){if(!db.cred)await enrollBio();await verifyBio();v=true}else toast("الجهاز لا يدعم البصمة: سيُسجَّل بدون تحقق")}
  catch(e){return fail("فشل التحقق بالبصمة، لم يُسجَّل شيء")}
  const r={eid:db.me.nid,name:db.me.name,t:type,ts:Date.now(),lat:p.lat,lng:p.lng,acc:p.acc,v};
  db.recs.push(r);save();push("recs",r);
  busy=false;toast(type==="in"?"تم تسجيل الحضور ✔":"تم تسجيل الانصراف ✔");render();
}

  <input id="ai" inputmode="numeric" maxlength="10" placeholder="رقم الهوية (10 أرقام)" style="margin-top:8px">
  <input id="am" placeholder="التخصص الدراسي" style="margin-top:8px"><button class="btn" onclick="addEmp()">إضافة</button></div>
  <div class="card"><h2>الموظفون (${L.length})</h2>${L.map(e=>`<div class="row"><span>${esc(e.name)}<br><span class="mut">${esc(e.nid)} • ${esc(e.major||"—")}</span></span><button class="hb" onclick="delEmp('${esc(e.nid)}')">حذف</button></div>`).join("")||'<div class="mut">لا يوجد موظفون.</div>'}</div>`;
}
async function addEmp(){
  const n=$("#an").value.trim(),i=$("#ai").value.trim(),m=$("#am").value.trim();
  if(n.length<3)return toast("اكتب الاسم الكامل");
  if(!/^[12]\d{9}$/.test(i))return toast("رقم الهوية 10 أرقام ويبدأ بـ 1 أو 2");
  if(!m)return toast("اكتب التخصص الدراسي");
  const o={name:n,nid:i,major:m};
  if(CFG.DB_URL){if(await api("emps/"+i,"PUT",o)===null)return toast("تعذّر الحفظ في قاعدة البيانات");R.emps[i]=o}else{db.emps[i]=o;save()}
  toast("تمت إضافة الموظف");render();
}
async function delEmp(i){
  if(!confirm("حذف هذا الموظف؟"))return;
  if(CFG.DB_URL){await api("emps/"+i,"DELETE");delete R.emps[i]}else{delete db.emps[i];save()}
  render();
}
const rowHtml=r=>`<div class="row"><span>${esc(r.name)} <span class="tag ${r.t}">${r.t==="in"?"حضور":"انصراف"}</span> ${fT(r.ts)}${r.lat!=null?` <a href="https://maps.google.com/?q=${r.lat},${r.lng}" target="_blank" rel="noopener">📍</a>`:""}</span><span class="mut">${r.v?"✔ بصمة":"بدون بصمة"}</span></div>`;
function vLog(){
  const rs=[...data()].reverse();if(!rs.length)return `<div class="card"><h2>السجل</h2><div class="mut">لا توجد تسجيلات.</div></div>`;
  const g={};rs.forEach(r=>(g[dayKey(r.ts)]=g[dayKey(r.ts)]||[]).push(r));
  return Object.values(g).map(a=>`<div class="card"><h3>${fD(a[0].ts)}</h3>${a.map(rowHtml).join("")}</div>`).join("");
}
function vReport(){
  const n=new Date(),inM=ts=>{const d=new Date(ts);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear()};
  const rows=Object.values(grp(data())).map(a=>{const days=new Set(a.filter(r=>r.t==="in"&&inM(r.ts)).map(r=>dayKey(r.ts))).size;
    return `<div class="row"><span>${esc(a[0].name)}</span><span>${days} يوم • ${fH(wk(a,inM))}</span></div>`}).join("")||`<div class="mut">لا توجد بيانات.</div>`;
  return `<div class="card"><h2>تقرير الشهر الحالي</h2>${rows}<button class="btn" onclick="exportCSV()">تصدير CSV</button></div>`;
}
function vSettings(){const S=getSite();return `<div class="card"><h2>الإعدادات</h2>
  <div class="row"><span>الحساب</span><b>${db.role==="mgr"?"المدير":"المشرف"}</b></div>
  <div class="row"><span>رقم الإصدار</span><b>${VERSION}</b></div>
  <div class="row"><span>Service Worker</span><span class="mut">${esc(swStatus)}</span></div>
  <div class="row"><span>المزامنة</span><span class="mut">${CFG.DB_URL?"مفعّلة":"غير مفعّلة"}</span></div>
  <h3 style="margin-top:12px">الثيم</h3>
  <select onchange="setTheme(this.value)"><option value="auto" ${db.theme==="auto"?"selected":""}>تلقائي</option><option value="light" ${db.theme==="light"?"selected":""}>فاتح</option><option value="dark" ${db.theme==="dark"?"selected":""}>داكن</option></select>
  <button class="btn" onclick="checkUpdate(true)">تحديث التطبيق</button></div>
  <div class="card"><h3>موقع المدرسة (نطاق 2 كم)</h3><div class="mut">${S?"المحدد: "+S.lat+" , "+S.lng:"غير محدد"}</div>
  <input id="sitein" placeholder="الصق رابط خرائط قوقل الكامل أو lat,lng" style="margin-top:8px">
  <button class="btn" onclick="saveSite()">حفظ الموقع</button><button class="btn s" onclick="siteHere()">اعتماد موقعي الحالي كموقع المدرسة</button></div>
  <div class="card"><h3>نسخ احتياطي واستعادة</h3><button class="btn" onclick="backup()">تصدير البيانات إلى ملف</button>
  <button class="btn s" onclick="$('#rf').click()">استيراد البيانات من ملف</button><input type="file" id="rf" accept=".json,application/json" hidden onchange="restore(this.files[0])"></div>
  <div class="card links"><a href="#terms">شروط الاستخدام</a><a href="#privacy">سياسة الخصوصية</a><a href="#about">من نحن</a><a href="#contact">اتصل بنا</a></div>
  <button class="btn s" onclick="logout()">تسجيل الخروج</button>`}

/* ================= الثيم والنسخ الاحتياطي والتحديث ================= */
function applyTheme(){document.documentElement.removeAttribute("data-theme");if(db.theme!=="auto")document.documentElement.setAttribute("data-theme",db.theme)}
function setTheme(v){db.theme=v;save();applyTheme()}
function download(n,t,type){const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([t],{type}));a.download=n;document.body.appendChild(a);a.click();a.remove()}
function backup(){download("attendance-backup-"+new Date().toISOString().slice(0,10)+".json",JSON.stringify({db,recs:R.recs}),"application/json");toast("تم تصدير النسخة الاحتياطية")}
function restore(f){if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.db||!Array.isArray(d.db.recs))throw 0;
    if(!confirm("سيتم استبدال بيانات هذا الجهاز. متابعة؟"))return;
    db=Object.assign(db,d.db,{role:db.role});if(Array.isArray(d.recs))R.recs=d.recs;save();applyTheme();render();toast("تمت الاستعادة بنجاح")}catch(e){toast("ملف غير صالح")}};
  r.readAsText(f)}
function exportCSV(){
  if(!staff())return;const rs=data();if(!rs.length)return toast("لا توجد بيانات للتصدير");
  const rows=["الاسم,رقم الهوية,النوع,التاريخ,الوقت,خط العرض,خط الطول,تحقق بصمة"];
  rs.forEach(r=>rows.push([r.name,r.eid,r.t==="in"?"حضور":"انصراف",new Date(r.ts).toLocaleDateString(nf),fT(r.ts),r.lat??"",r.lng??"",r.v?"نعم":"لا"].join(",")));
  download("attendance.csv","\ufeff"+rows.join("\n"),"text/csv;charset=utf-8");
}
async function checkUpdate(manual){
  try{const t=await(await fetch(location.href.split("#")[0],{cache:"no-store"})).text();const m=t.match(/const VERSION="([^"]+)"/);
    if(m&&m[1]!==VERSION){$("#ban").style.display="flex";if(manual)toast("يوجد إصدار جديد: "+m[1])}else if(manual)toast("أنت على أحدث إصدار ("+VERSION+")")}
  catch(e){if(manual)toast("تعذّر التحقق (لا اتصال بالإنترنت)")}
}

/* ================= العرض ================= */
function render(){
  const h=(location.hash||"#home").slice(1),st=staff();
  document.body.classList.toggle("st",st);
  $("#app").innerHTML=staticPages[h]?vStatic(h):h==="staff"?vStaffLogin():!db.role?vWelcome():!st?vEmp():
    h==="emps"?vEmps():h==="log"?vLog():h==="report"?vReport():h==="settings"?vSettings():vDash();
  document.querySelectorAll("#nav a").forEach(a=>a.classList.toggle("on",a.getAttribute("href")==="#"+h||(h==="home"&&a.getAttribute("href")==="#home")));
  scrollTo(0,0);
}
addEventListener("hashchange",render);
setInterval(()=>{const c=$("#clk");if(c)c.textContent=fT(Date.now())},1000);
applyTheme();render();checkUpdate(false);flush();pullSite();startPoll();startWatch();
</script>
</body>
</html>
